<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrack AI - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FFFFFF;
            color: #4B4B4B;
        }
        
        /* Duolingo-style 3D Button Effect */
        .btn-3d {
            position: relative;
            transition: all 0.1s active;
            border-bottom-width: 4px;
        }
        .btn-3d:active {
            border-bottom-width: 0px !important;
            transform: translateY(4px);
        }

        /* Card Styles */
        .duo-card {
            border: 2px solid #E5E5E5;
            border-bottom-width: 4px;
        }

        /* Custom Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #58CC02;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #58CC02;
        }
    </style>
</head>
<body>
    <div class="w-full h-screen flex flex-col bg-white" data-sd-id="1">
        <!-- Header -->
        <header class="shrink-0 pt-14 px-6 pb-4 bg-white border-b-2 border-gray-100 flex items-center justify-between" data-sd-id="2">
            <div class="flex items-center gap-3" data-sd-id="3">
                <div class="w-12 h-12 rounded-2xl bg-[#9B59B6] flex items-center justify-center text-white shadow-sm" data-sd-id="4">
                    <iconify-icon icon="lucide:shield-check" class="text-2xl"></iconify-icon>
                </div>
                <div data-sd-id="5">
                    <h1 class="text-xl font-extrabold tracking-tight leading-none" data-sd-id="6">Hi Ms. Kavitha!</h1>
                    <div class="mt-1 px-2 py-0.5 bg-[#9B59B6]/10 text-[#9B59B6] text-[10px] font-black uppercase tracking-widest rounded-md inline-block" data-sd-id="7">
                        Administrator
                    </div>
                </div>
            </div>
            <button id="header-notif-btn" class="w-11 h-11 rounded-xl duo-card bg-white flex items-center justify-center" data-sd-id="8">
                <iconify-icon icon="lucide:settings" class="text-xl text-gray-400"></iconify-icon>
            </button>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto px-6 py-6 space-y-8" data-sd-id="9">
            
            <!-- Quick Stats Grid -->
            <section class="grid grid-cols-2 gap-4" data-sd-id="10">
                <div class="duo-card rounded-[20px] p-4 bg-white" data-sd-id="11">
                    <div class="flex items-center gap-2 mb-1" data-sd-id="12">
                        <iconify-icon icon="lucide:users" class="text-[#1CB0F6] text-lg"></iconify-icon>
                        <span class="text-[10px] font-black text-gray-400 uppercase tracking-wider" data-sd-id="13">Students</span>
                    </div>
                    <p class="text-2xl font-black" data-sd-id="14">1,240</p>
                </div>
                <div class="duo-card rounded-[20px] p-4 bg-white" data-sd-id="15">
                    <div class="flex items-center gap-2 mb-1" data-sd-id="16">
                        <iconify-icon icon="lucide:user-cog" class="text-[#FFC800] text-lg"></iconify-icon>
                        <span class="text-[10px] font-black text-gray-400 uppercase tracking-wider" data-sd-id="17">Faculty</span>
                    </div>
                    <p class="text-2xl font-black" data-sd-id="18">48</p>
                </div>
                <div class="duo-card rounded-[20px] p-4 bg-white" data-sd-id="19">
                    <div class="flex items-center gap-2 mb-1" data-sd-id="20">
                        <iconify-icon icon="lucide:book-check" class="text-[#58CC02] text-lg"></iconify-icon>
                        <span class="text-[10px] font-black text-gray-400 uppercase tracking-wider" data-sd-id="21">Active Tasks</span>
                    </div>
                    <p class="text-2xl font-black" data-sd-id="22">312</p>
                </div>
                <div class="duo-card rounded-[20px] p-4 bg-white" data-sd-id="23">
                    <div class="flex items-center gap-2 mb-1" data-sd-id="24">
                        <iconify-icon icon="lucide:megaphone" class="text-[#FF4B4B] text-lg"></iconify-icon>
                        <span class="text-[10px] font-black text-gray-400 uppercase tracking-wider" data-sd-id="25">Notices</span>
                    </div>
                    <p class="text-2xl font-black" data-sd-id="26">12</p>
                </div>
            </section>

            <!-- User Management -->
            <section class="space-y-4" data-sd-id="27">
                <div class="flex items-center justify-between" data-sd-id="28">
                    <h3 class="text-xl font-black" data-sd-id="29">User Management</h3>
                    <button id="add-user-btn" class="w-10 h-10 bg-[#58CC02] text-white rounded-xl btn-3d border-b-[#46A302] flex items-center justify-center" data-sd-id="30">
                        <iconify-icon icon="lucide:plus" class="text-2xl"></iconify-icon>
                    </button>
                </div>

                <!-- Search & Filter -->
                <div class="flex gap-2" data-sd-id="31">
                    <div class="flex-1 relative" data-sd-id="32">
                        <iconify-icon icon="lucide:search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></iconify-icon>
                        <input type="text" placeholder="Search name..." class="w-full pl-10 pr-4 py-3 bg-[#F7F7F7] border-2 border-[#E5E5E5] rounded-2xl font-bold text-sm focus:outline-none focus:border-[#9B59B6] transition-colors" data-sd-id="33">
                    </div>
                    <button id="filter-btn" class="px-4 bg-white duo-card rounded-2xl flex items-center justify-center" data-sd-id="34">
                        <iconify-icon icon="lucide:filter" class="text-gray-400"></iconify-icon>
                    </button>
                </div>

                <!-- User Cards -->
                <div class="space-y-3" data-sd-id="35">
                    <!-- User 1: Faculty -->
                    <div class="duo-card rounded-[20px] p-4 bg-white flex items-center justify-between" data-sd-id="36">
                        <div class="flex items-center gap-3" data-sd-id="37">
                            <div class="w-11 h-11 rounded-full bg-[#1CB0F6]/10 flex items-center justify-center border-2 border-[#1CB0F6]/20" data-sd-id="38">
                                <iconify-icon icon="lucide:user" class="text-[#1CB0F6] text-xl"></iconify-icon>
                            </div>
                            <div data-sd-id="39">
                                <h4 class="font-black text-base leading-tight" data-sd-id="40">Arun Kumar</h4>
                                <p class="text-xs font-bold text-[#1CB0F6] uppercase tracking-wide" data-sd-id="41">Faculty</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3" data-sd-id="42">
                            <!-- Toggle -->
                            <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in" data-sd-id="43">
                                <input type="checkbox" name="toggle" id="toggle-1" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-[#E5E5E5] checked:right-0 right-4 transition-all duration-200" checked="" data-sd-id="44">
                                <label for="toggle-1" class="toggle-label block overflow-hidden h-6 rounded-full bg-[#E5E5E5] cursor-pointer" data-sd-id="45"></label>
                            </div>
                            <button id="edit-user-1" class="w-9 h-9 bg-[#F7F7F7] rounded-lg flex items-center justify-center border-2 border-[#E5E5E5]" data-sd-id="46">
                                <iconify-icon icon="lucide:more-vertical" class="text-gray-400"></iconify-icon>
                            </button>
                        </div>
                    </div>

                    <!-- User 2: Student -->
                    <div class="duo-card rounded-[20px] p-4 bg-white flex items-center justify-between" data-sd-id="47">
                        <div class="flex items-center gap-3" data-sd-id="48">
                            <div class="w-11 h-11 rounded-full bg-[#58CC02]/10 flex items-center justify-center border-2 border-[#58CC02]/20" data-sd-id="49">
                                <iconify-icon icon="lucide:graduation-cap" class="text-[#58CC02] text-xl"></iconify-icon>
                            </div>
                            <div data-sd-id="50">
                                <h4 class="font-black text-base leading-tight" data-sd-id="51">Priya Sharma</h4>
                                <p class="text-xs font-bold text-[#58CC02] uppercase tracking-wide" data-sd-id="52">Student</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3" data-sd-id="53">
                            <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in" data-sd-id="54">
                                <input type="checkbox" name="toggle" id="toggle-2" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-[#E5E5E5] checked:right-0 right-4 transition-all duration-200" checked="" data-sd-id="55">
                                <label for="toggle-2" class="toggle-label block overflow-hidden h-6 rounded-full bg-[#E5E5E5] cursor-pointer" data-sd-id="56"></label>
                            </div>
                            <button id="edit-user-2" class="w-9 h-9 bg-[#F7F7F7] rounded-lg flex items-center justify-center border-2 border-[#E5E5E5]" data-sd-id="57">
                                <iconify-icon icon="lucide:more-vertical" class="text-gray-400"></iconify-icon>
                            </button>
                        </div>
                    </div>

                    <!-- User 3: Admin -->
                    <div class="duo-card rounded-[20px] p-4 bg-white flex items-center justify-between" data-sd-id="58">
                        <div class="flex items-center gap-3" data-sd-id="59">
                            <div class="w-11 h-11 rounded-full bg-[#9B59B6]/10 flex items-center justify-center border-2 border-[#9B59B6]/20" data-sd-id="60">
                                <iconify-icon icon="lucide:shield-check" class="text-[#9B59B6] text-xl"></iconify-icon>
                            </div>
                            <div data-sd-id="61">
                                <h4 class="font-black text-base leading-tight" data-sd-id="62">David Wilson</h4>
                                <p class="text-xs font-bold text-[#9B59B6] uppercase tracking-wide" data-sd-id="63">Admin</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3" data-sd-id="64">
                            <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in" data-sd-id="65">
                                <input type="checkbox" name="toggle" id="toggle-3" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-[#E5E5E5] checked:right-0 right-4 transition-all duration-200" checked="" data-sd-id="66">
                                <label for="toggle-3" class="toggle-label block overflow-hidden h-6 rounded-full bg-[#E5E5E5] cursor-pointer" data-sd-id="67"></label>
                            </div>
                            <button id="edit-user-3" class="w-9 h-9 bg-[#F7F7F7] rounded-lg flex items-center justify-center border-2 border-[#E5E5E5]" data-sd-id="68">
                                <iconify-icon icon="lucide:more-vertical" class="text-gray-400"></iconify-icon>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- System Permissions -->
            <section class="space-y-4" data-sd-id="69">
                <h3 class="text-xl font-black" data-sd-id="70">System Permissions</h3>
                <div class="duo-card rounded-[20px] p-5 bg-[#F7F7F7] border-none space-y-5" data-sd-id="71">
                    <div class="flex items-center justify-between" data-sd-id="72">
                        <div class="flex items-center gap-3" data-sd-id="73">
                            <iconify-icon icon="lucide:brain" class="text-2xl text-[#1CB0F6]"></iconify-icon>
                            <span class="font-bold" data-sd-id="74">AI Assistant Features</span>
                        </div>
                        <div class="relative inline-block w-10 align-middle select-none" data-sd-id="75">
                            <input type="checkbox" id="perm-1" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-[#E5E5E5] checked:right-0 right-4 transition-all duration-200" checked="" data-sd-id="76">
                            <label for="perm-1" class="toggle-label block overflow-hidden h-6 rounded-full bg-[#E5E5E5] cursor-pointer" data-sd-id="77"></label>
                        </div>
                    </div>
                    <div class="flex items-center justify-between" data-sd-id="78">
                        <div class="flex items-center gap-3" data-sd-id="79">
                            <iconify-icon icon="lucide:file-up" class="text-2xl text-[#58CC02]"></iconify-icon>
                            <span class="font-bold" data-sd-id="80">Document Uploads</span>
                        </div>
                        <div class="relative inline-block w-10 align-middle select-none" data-sd-id="81">
                            <input type="checkbox" id="perm-2" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-[#E5E5E5] checked:right-0 right-4 transition-all duration-200" checked="" data-sd-id="82">
                            <label for="perm-2" class="toggle-label block overflow-hidden h-6 rounded-full bg-[#E5E5E5] cursor-pointer" data-sd-id="83"></label>
                        </div>
                    </div>
                    <div class="flex items-center justify-between" data-sd-id="84">
                        <div class="flex items-center gap-3" data-sd-id="85">
                            <iconify-icon icon="lucide:bell-ring" class="text-2xl text-[#FF9600]"></iconify-icon>
                            <span class="font-bold" data-sd-id="86">Global Notifications</span>
                        </div>
                        <div class="relative inline-block w-10 align-middle select-none" data-sd-id="87">
                            <input type="checkbox" id="perm-3" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-[#E5E5E5] checked:right-0 right-4 transition-all duration-200" checked="" data-sd-id="88">
                            <label for="perm-3" class="toggle-label block overflow-hidden h-6 rounded-full bg-[#E5E5E5] cursor-pointer" data-sd-id="89"></label>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Spacer for Nav -->
            <div class="h-10" data-sd-id="90"></div>
        </main>

        <!-- Bottom Navigation -->
        <footer class="shrink-0 pb-[34px] bg-white border-t-2 border-[#E5E5E5] px-4 flex items-center justify-between h-[100px] z-50" data-sd-id="91">
            <a href="admin.html" id="nav-home" class="flex flex-col items-center gap-1 group py-2 flex-1" data-sd-id="92">
                <iconify-icon icon="lucide:home" class="text-2xl text-gray-300 group-hover:text-[#9B59B6] transition-colors"></iconify-icon>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest" data-sd-id="93">Home</span>
            </a>
            <a href="assignments.html" id="nav-assignments" class="flex flex-col items-center gap-1 group py-2 flex-1" data-sd-id="94">
                <iconify-icon icon="lucide:book-open" class="text-2xl text-gray-300 group-hover:text-[#9B59B6] transition-colors"></iconify-icon>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest" data-sd-id="95">Tasks</span>
            </a>
            <a href="assistant.html" id="nav-ai" class="flex flex-col items-center gap-1 group py-2 flex-1 relative -top-2" data-sd-id="96">
                <div class="w-14 h-14 rounded-2xl bg-[#1CB0F6] btn-3d border-b-[#1483B8] flex items-center justify-center text-white shadow-lg" data-sd-id="97">
                    <iconify-icon icon="lucide:sparkles" class="text-3xl"></iconify-icon>
                </div>
            </a>
            <a href="announcements.html" id="nav-announcements" class="flex flex-col items-center gap-1 group py-2 flex-1" data-sd-id="98">
                <iconify-icon icon="lucide:bell" class="text-2xl text-gray-300 group-hover:text-[#9B59B6] transition-colors"></iconify-icon>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest" data-sd-id="99">Feed</span>
            </a>
            <a href="admin.html" id="nav-admin" class="flex flex-col items-center gap-1 group py-2 flex-1" data-sd-id="100">
                <div class="w-12 h-8 rounded-xl bg-[#9B59B6]/10 flex items-center justify-center" data-sd-id="101">
                    <iconify-icon icon="lucide:shield-check" class="text-2xl text-[#9B59B6]"></iconify-icon>
                </div>
                <span class="text-[10px] font-black text-[#9B59B6] uppercase tracking-widest" data-sd-id="102">Admin</span>
            </a>
        </footer>
    </div>

</body></html>
