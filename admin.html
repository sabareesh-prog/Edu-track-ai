<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrack AI - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="script.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FFFFFF;
            color: #4B4B4B;
        }
        
        /* Duolingo-style 3D Button Effect */
        .btn-3d {
            position: relative;
            transition: all 0.1s;
            border-bottom-width: 4px;
        }
        .btn-3d:active {
            border-bottom-width: 0px !important;
            transform: translateY(4px);
        }

        /* Card Styles */
        .duo-card {
            border: 2px solid #E5E5E5;
            border-bottom-width: 4px;
            transition: all 0.15s ease;
        }

        /* Custom Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #58CC02;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #58CC02;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div class="w-full h-screen flex flex-col bg-white">
        <!-- Header -->
        <header class="shrink-0 pt-14 px-6 pb-4 bg-white border-b-2 border-gray-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-[#9B59B6] flex items-center justify-center text-white shadow-sm cursor-pointer" onclick="showProfileModal({ name: 'Ms. Kavitha', role: 'admin' })">
                    <iconify-icon icon="lucide:shield-check" class="text-2xl"></iconify-icon>
                </div>
                <div>
                    <h1 id="admin-greeting" class="text-xl font-extrabold tracking-tight leading-none">Hi Ms. Kavitha!</h1>
                    <div class="mt-1 px-2 py-0.5 bg-[#9B59B6]/10 text-[#9B59B6] text-[10px] font-black uppercase tracking-widest rounded-md inline-block">
                        Administrator
                    </div>
                </div>
            </div>
            <button id="header-settings-btn" class="w-11 h-11 rounded-xl duo-card bg-white flex items-center justify-center hover:bg-gray-50 cursor-pointer" title="Admin Settings">
                <iconify-icon icon="lucide:settings" class="text-xl text-gray-400"></iconify-icon>
            </button>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto px-6 py-6 space-y-6 no-scrollbar">
            
            <!-- Quick Stats Grid -->
            <section class="grid grid-cols-2 gap-4">
                <div class="duo-card rounded-[20px] p-4 bg-white">
                    <div class="flex items-center gap-2 mb-1">
                        <iconify-icon icon="lucide:users" class="text-[#1CB0F6] text-lg"></iconify-icon>
                        <span class="text-[10px] font-black text-gray-400 uppercase tracking-wider">Students</span>
                    </div>
                    <p id="stat-students" class="text-2xl font-black">1</p>
                </div>
                <div class="duo-card rounded-[20px] p-4 bg-white">
                    <div class="flex items-center gap-2 mb-1">
                        <iconify-icon icon="lucide:user-cog" class="text-[#FFC800] text-lg"></iconify-icon>
                        <span class="text-[10px] font-black text-gray-400 uppercase tracking-wider">Faculty</span>
                    </div>
                    <p id="stat-faculty" class="text-2xl font-black">1</p>
                </div>
                <div class="duo-card rounded-[20px] p-4 bg-white">
                    <div class="flex items-center gap-2 mb-1">
                        <iconify-icon icon="lucide:book-check" class="text-[#58CC02] text-lg"></iconify-icon>
                        <span class="text-[10px] font-black text-gray-400 uppercase tracking-wider">Active Tasks</span>
                    </div>
                    <p id="stat-tasks" class="text-2xl font-black">0</p>
                </div>
                <div class="duo-card rounded-[20px] p-4 bg-white">
                    <div class="flex items-center gap-2 mb-1">
                        <iconify-icon icon="lucide:megaphone" class="text-[#FF4B4B] text-lg"></iconify-icon>
                        <span class="text-[10px] font-black text-gray-400 uppercase tracking-wider">Notices</span>
                    </div>
                    <p id="stat-notices" class="text-2xl font-black">0</p>
                </div>
            </section>

            <!-- User Management -->
            <section class="space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-xl font-black">User Directory</h3>
                    <button id="add-user-btn" class="w-10 h-10 bg-[#58CC02] text-white rounded-xl btn-3d border-b-[#46A302] flex items-center justify-center cursor-pointer" title="Add User">
                        <iconify-icon icon="lucide:plus" class="text-2xl"></iconify-icon>
                    </button>
                </div>

                <!-- Search & Filter -->
                <div class="flex gap-2">
                    <div class="flex-1 relative">
                        <iconify-icon icon="lucide:search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></iconify-icon>
                        <input type="text" id="user-search-input" placeholder="Search accounts by name..." class="w-full pl-10 pr-4 py-3 bg-[#F7F7F7] border-2 border-[#E5E5E5] rounded-2xl font-bold text-sm focus:outline-none focus:border-[#9B59B6] transition-colors">
                    </div>
                    <button id="filter-role-btn" class="px-4 bg-white duo-card rounded-2xl flex items-center justify-center hover:bg-gray-50 cursor-pointer" title="Filter by role">
                        <iconify-icon icon="lucide:filter" class="text-gray-400"></iconify-icon>
                    </button>
                </div>

                <!-- User Cards List -->
                <div id="users-container" class="space-y-3">
                    <!-- Populated dynamically -->
                </div>
            </section>

            <!-- System Permissions -->
            <section class="space-y-4">
                <h3 class="text-xl font-black">System Controls</h3>
                <div class="duo-card rounded-[20px] p-5 bg-[#F7F7F7] border-none space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <iconify-icon icon="lucide:brain" class="text-2xl text-[#1CB0F6]"></iconify-icon>
                            <span class="font-bold text-sm">AI Assistant Engine</span>
                        </div>
                        <input type="checkbox" id="perm-1" checked class="perm-toggle w-5 h-5 accent-[#58CC02] cursor-pointer">
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <iconify-icon icon="lucide:file-up" class="text-2xl text-[#58CC02]"></iconify-icon>
                            <span class="font-bold text-sm">Document Analysis</span>
                        </div>
                        <input type="checkbox" id="perm-2" checked class="perm-toggle w-5 h-5 accent-[#58CC02] cursor-pointer">
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <iconify-icon icon="lucide:bell-ring" class="text-2xl text-[#FF9600]"></iconify-icon>
                            <span class="font-bold text-sm">Broadcast Notifications</span>
                        </div>
                        <input type="checkbox" id="perm-3" checked class="perm-toggle w-5 h-5 accent-[#58CC02] cursor-pointer">
                    </div>
                </div>
            </section>

            <!-- Spacer for Nav -->
            <div class="h-24"></div>
        </main>

        <!-- Bottom Navigation -->
        <footer class="shrink-0 pb-[34px] bg-white border-t-2 border-[#E5E5E5] px-4 flex items-center justify-between h-[100px] z-50">
            <a href="admin.html" id="nav-admin-home" class="flex flex-col items-center gap-1 group py-2 flex-1">
                <div class="w-12 h-8 rounded-xl bg-[#9B59B6]/15 flex items-center justify-center">
                    <iconify-icon icon="lucide:shield-check" class="text-2xl text-[#9B59B6]"></iconify-icon>
                </div>
                <span class="text-[10px] font-black text-[#9B59B6] uppercase tracking-widest">Admin</span>
            </a>
            <a href="assignments.html" class="flex flex-col items-center gap-1 group py-2 flex-1">
                <div class="w-12 h-8 rounded-xl flex items-center justify-center">
                    <iconify-icon icon="lucide:book-open" class="text-2xl text-gray-300 group-hover:text-[#9B59B6] transition-colors"></iconify-icon>
                </div>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Tasks</span>
            </a>
            <a href="assistant.html" class="flex flex-col items-center gap-1 group py-2 flex-1 relative -top-2">
                <div class="w-14 h-14 rounded-2xl bg-[#1CB0F6] btn-3d border-b-[#1483B8] flex items-center justify-center text-white shadow-lg">
                    <iconify-icon icon="lucide:sparkles" class="text-3xl"></iconify-icon>
                </div>
            </a>
            <a href="announcements.html" class="flex flex-col items-center gap-1 group py-2 flex-1">
                <div class="w-12 h-8 rounded-xl flex items-center justify-center">
                    <iconify-icon icon="lucide:bell" class="text-2xl text-gray-300 group-hover:text-[#9B59B6] transition-colors"></iconify-icon>
                </div>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Feed</span>
            </a>
            <a href="login.html" class="flex flex-col items-center gap-1 group py-2 flex-1">
                <div class="w-12 h-8 rounded-xl flex items-center justify-center">
                    <iconify-icon icon="lucide:user-circle" class="text-2xl text-gray-300 group-hover:text-[#9B59B6] transition-colors"></iconify-icon>
                </div>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Profile</span>
            </a>
        </footer>

        <!-- Add User Modal -->
        <div id="add-user-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
            <div class="bg-white rounded-[28px] duo-card max-w-sm w-full p-6 shadow-2xl space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-xl font-black text-[#4B4B4B]">Create Account</h3>
                    <button id="close-user-modal" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-400 hover:bg-gray-200 cursor-pointer">
                        <iconify-icon icon="lucide:x" class="text-xl"></iconify-icon>
                    </button>
                </div>
                <form id="add-user-form" class="space-y-3">
                    <div>
                        <label class="text-[10px] font-black uppercase text-gray-400">Full Name</label>
                        <input type="text" id="new-user-name" required placeholder="e.g. Rahul Verma" class="w-full p-3.5 bg-gray-50 border-2 border-gray-200 rounded-xl font-bold text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] font-black uppercase text-gray-400">Email Address</label>
                        <input type="email" id="new-user-email" required placeholder="user@edutrack.ai" class="w-full p-3.5 bg-gray-50 border-2 border-gray-200 rounded-xl font-bold text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] font-black uppercase text-gray-400">Role</label>
                        <select id="new-user-role" class="w-full p-3.5 bg-gray-50 border-2 border-gray-200 rounded-xl font-bold text-sm">
                            <option value="student">Student</option>
                            <option value="faculty">Faculty</option>
                            <option value="admin">Administrator</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full py-4 bg-[#9B59B6] text-white font-black uppercase tracking-wider rounded-xl btn-3d border-b-[#7E22CE] cursor-pointer mt-2 text-xs">
                        Create Account
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentRoleFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            const session = getSession();
            if (session.isLoggedIn && session.user) {
                document.getElementById('admin-greeting').textContent = `Hi ${session.user.name || 'Ms. Kavitha'}!`;
            }

            renderUsers();
            updateStats();

            // Modal Controls
            const addModal = document.getElementById('add-user-modal');
            const openAddBtn = document.getElementById('add-user-btn');
            const closeAddBtn = document.getElementById('close-user-modal');

            openAddBtn.addEventListener('click', () => addModal.classList.remove('hidden'));
            closeAddBtn.addEventListener('click', () => addModal.classList.add('hidden'));

            // Form Submit: Add User
            document.getElementById('add-user-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('new-user-name').value.trim();
                const email = document.getElementById('new-user-email').value.trim();
                const role = document.getElementById('new-user-role').value;

                if (!name || !email) return;

                const accounts = getAccounts();
                const newAcc = {
                    id: 'acc_' + Date.now(),
                    name,
                    email,
                    password: 'password123',
                    role,
                    status: 'Active'
                };

                accounts.push(newAcc);
                saveAccounts(accounts);

                addModal.classList.add('hidden');
                document.getElementById('add-user-form').reset();
                showToast('Account Created! 👤', `${name} registered as ${role.toUpperCase()}.`, 'lucide:user-plus', '#58CC02');
                renderUsers();
                updateStats();
            });

            // Live Search
            document.getElementById('user-search-input').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                document.querySelectorAll('.user-item-card').forEach(card => {
                    const name = card.getAttribute('data-name').toLowerCase();
                    const email = card.getAttribute('data-email').toLowerCase();
                    if (name.includes(query) || email.includes(query)) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });

            // Filter by Role
            const filterRoles = ['all', 'student', 'faculty', 'admin'];
            let filterIdx = 0;
            document.getElementById('filter-role-btn').addEventListener('click', () => {
                filterIdx = (filterIdx + 1) % filterRoles.length;
                currentRoleFilter = filterRoles[filterIdx];
                showToast('Filter Changed', `Showing: ${currentRoleFilter.toUpperCase()}`, 'lucide:filter', '#9B59B6');
                renderUsers();
            });

            // Permissions Checkboxes
            document.querySelectorAll('.perm-toggle').forEach(t => {
                t.addEventListener('change', (e) => {
                    showToast('Policy Updated', `Control toggle changed to ${e.target.checked ? 'Active' : 'Disabled'}.`, 'lucide:shield', e.target.checked ? '#58CC02' : '#FF9600');
                });
            });

            // Settings Header Button
            document.getElementById('header-settings-btn').addEventListener('click', () => {
                showToast('Platform Online', 'EduTrack engine running smoothly with local persistence.', 'lucide:cpu', '#1CB0F6');
            });
        });

        function updateStats() {
            const accounts = getAccounts();
            const tasks = getTasks();
            const announcements = getAnnouncements();

            const studentCount = accounts.filter(a => a.role === 'student').length;
            const facultyCount = accounts.filter(a => a.role === 'faculty').length;
            const activeTasks = tasks.filter(t => t.status !== 'Completed').length;

            document.getElementById('stat-students').textContent = studentCount || 1;
            document.getElementById('stat-faculty').textContent = facultyCount || 1;
            document.getElementById('stat-tasks').textContent = activeTasks;
            document.getElementById('stat-notices').textContent = announcements.length;
        }

        function renderUsers() {
            const accounts = getAccounts();
            const container = document.getElementById('users-container');
            container.innerHTML = '';

            let filtered = accounts;
            if (currentRoleFilter !== 'all') {
                filtered = accounts.filter(a => a.role === currentRoleFilter);
            }

            const roleMeta = {
                student: { color: '#58CC02', icon: 'lucide:graduation-cap' },
                faculty: { color: '#1CB0F6', icon: 'lucide:book-user' },
                admin:   { color: '#9B59B6', icon: 'lucide:shield-check' }
            };

            filtered.forEach(acc => {
                const meta = roleMeta[acc.role] || roleMeta.student;
                const card = document.createElement('div');
                card.className = 'duo-card rounded-[20px] p-4 bg-white flex items-center justify-between user-item-card';
                card.setAttribute('data-name', acc.name || '');
                card.setAttribute('data-email', acc.email || '');

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-full flex items-center justify-center border-2 shrink-0" style="background-color: ${meta.color}15; border-color: ${meta.color}40; color: ${meta.color};">
                            <iconify-icon icon="${meta.icon}" class="text-xl"></iconify-icon>
                        </div>
                        <div>
                            <h4 class="font-black text-base leading-tight text-[#4B4B4B]">${escapeHtml(acc.name)}</h4>
                            <p class="text-xs font-bold uppercase tracking-wide" style="color: ${meta.color};">${acc.role} • <span class="text-gray-400 normal-case">${escapeHtml(acc.email)}</span></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-black uppercase text-[#58CC02] bg-[#58CC02]/10 px-2.5 py-1 rounded-full">Active</span>
                        <button class="delete-acc-btn text-gray-300 hover:text-[#FF4B4B] p-1.5" title="Remove account">
                            <iconify-icon icon="lucide:trash-2" class="text-base"></iconify-icon>
                        </button>
                    </div>
                `;

                card.querySelector('.delete-acc-btn').addEventListener('click', () => {
                    if (confirm(`Remove account for ${acc.name}?`)) {
                        const updated = getAccounts().filter(a => a.email !== acc.email);
                        saveAccounts(updated);
                        showToast('Account Deleted', `${acc.name} removed.`, 'lucide:trash', '#FF4B4B');
                        renderUsers();
                        updateStats();
                    }
                });

                container.appendChild(card);
            });
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body></html>
