<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrack AI - Faculty Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="script.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FFFFFF;
            color: #4B4B4B;
        }
        
        /* Duolingo-style 3D Button Effect */
        .btn-3d {
            position: relative;
            transition: all 0.1s;
            border-bottom-width: 4px;
        }
        .btn-3d:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }

        /* Card Styles */
        .duo-card {
            border: 2px solid #E5E5E5;
            border-bottom-width: 4px;
            transition: all 0.15s ease;
        }

        /* Form Input focus */
        .duo-input:focus {
            outline: none;
            border-color: #1CB0F6;
        }

        /* Mascot float animation */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .float-mascot {
            animation: float 4s ease-in-out infinite;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div class="w-full h-screen flex flex-col bg-white">
        <!-- Header / Faculty Greeting -->
        <header class="shrink-0 pt-14 px-6 pb-4 bg-white border-b-2 border-gray-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#1CB0F6] flex items-center justify-center text-white shadow-sm cursor-pointer" onclick="showProfileModal({ name: 'Prof. Arun Kumar', role: 'faculty' })">
                    <iconify-icon icon="lucide:user" class="text-2xl"></iconify-icon>
                </div>
                <div>
                    <h1 id="faculty-greeting" class="text-xl font-extrabold tracking-tight leading-none">Hi Prof. Arun!</h1>
                    <p class="text-sm font-bold text-[#1CB0F6] uppercase tracking-wider">Faculty Portal</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex flex-col items-center">
                    <span id="stat-tasks-count" class="font-black text-[#58CC02] text-lg leading-none">0</span>
                    <span class="text-[10px] font-black text-gray-400 uppercase">Tasks</span>
                </div>
                <div class="w-[2px] h-6 bg-gray-100"></div>
                <div class="flex flex-col items-center">
                    <span id="stat-notices-count" class="font-black text-[#FFC800] text-lg leading-none">0</span>
                    <span class="text-[10px] font-black text-gray-400 uppercase">Notices</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto px-6 py-6 space-y-6 no-scrollbar">
            
            <!-- Welcome Mascot Card -->
            <section class="relative bg-[#1CB0F6] rounded-[20px] p-6 text-white overflow-hidden shadow-lg shadow-blue-100">
                <div class="relative z-10 pr-24">
                    <h3 class="text-xl font-black mb-1">Class Manager</h3>
                    <p class="font-bold opacity-90 leading-snug">Create assignments & blast announcements directly to student devices.</p>
                </div>
                <!-- Educational Logo -->
                <div class="absolute -right-2 -bottom-2 w-28 h-28 float-mascot pointer-events-none">
                   <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-md">
                       <!-- Badge Background -->
                       <rect x="6" y="6" width="88" height="88" rx="26" fill="#1CB0F6"/>
                       <rect x="9" y="9" width="82" height="82" rx="23" stroke="white" stroke-width="2" stroke-opacity="0.3"/>
                       
                       <!-- Knowledge Star -->
                       <path d="M50 14L52 19.5L57.5 21.5L52 23.5L50 29L48 23.5L42.5 21.5L48 19.5Z" fill="#FFC800"/>
                       
                       <!-- Graduation Cap -->
                       <path d="M34 46C34 52 41 56 50 56C59 56 66 52 66 46V41H34V46Z" fill="#1E293B"/>
                       <polygon points="50,29 78,40 50,51 22,40" fill="#0F172A"/>
                       <polygon points="50,32 73,40 50,48 27,40" fill="#1E293B"/>
                       
                       <!-- Tassel -->
                       <ellipse cx="50" cy="40" rx="3" ry="2" fill="#FFC800"/>
                       <path d="M50 40C58 41 66 45 70 51C72 54 73 59 73 62" stroke="#FFC800" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                       <circle cx="73" cy="63" r="2.5" fill="#FFC800"/>

                       <!-- Open Book -->
                       <path d="M50 65C43 61 31 59 19 63V80C31 76 43 78 50 82C57 78 69 76 81 80V63C69 59 57 61 50 65Z" fill="#0D82BA"/>
                       <path d="M50 64C43 60 31 58 20 62V78C31 74 43 76 50 80V64Z" fill="#FFFFFF"/>
                       <path d="M50 64C57 60 69 58 80 62V78C69 74 57 76 50 80V64Z" fill="#F1F5F9"/>
                       <path d="M50 64V80" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
                   </svg>
                </div>
            </section>

            <!-- Action Tabs / Forms Container -->
            <section class="space-y-4">
                <div class="flex gap-2 p-1 bg-gray-100 rounded-2xl">
                    <button id="tab-assign" class="flex-1 py-3 px-2 rounded-xl bg-white duo-card border-none text-xs font-black text-[#1CB0F6] uppercase tracking-wide cursor-pointer transition-all">Create Assignment</button>
                    <button id="tab-announcement" class="flex-1 py-3 px-2 rounded-xl bg-transparent text-xs font-black text-gray-400 uppercase tracking-wide cursor-pointer transition-all">Broadcast Notice</button>
                </div>

                <!-- Form Container -->
                <div id="form-container" class="duo-card rounded-[20px] p-5 bg-white space-y-4">
                    <!-- Populated dynamically -->
                </div>
            </section>

            <!-- Published Works List -->
            <section class="space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-xl font-black">Published Works</h3>
                    <a href="assignments.html" class="text-xs font-black text-[#1CB0F6] uppercase hover:underline">View All Tasks</a>
                </div>

                <div id="published-list-container" class="space-y-3">
                    <!-- Populated dynamically from localStorage -->
                </div>
            </section>

            <div class="h-24"></div>
        </main>

        <!-- Bottom Navigation -->
        <footer class="shrink-0 pb-[34px] bg-white border-t-2 border-[#E5E5E5] px-4 flex items-center justify-between h-[100px] z-50">
            <a href="faculty.html" id="nav-faculty-home" class="flex flex-col items-center gap-1 group py-2 flex-1">
                <div class="w-12 h-8 rounded-xl bg-[#1CB0F6]/10 flex items-center justify-center">
                    <iconify-icon icon="lucide:home" class="text-2xl text-[#1CB0F6]"></iconify-icon>
                </div>
                <span class="text-[10px] font-black text-[#1CB0F6] uppercase tracking-widest">Home</span>
            </a>
            <a href="assignments.html" class="flex flex-col items-center gap-1 group py-2 flex-1">
                <div class="w-12 h-8 rounded-xl flex items-center justify-center">
                    <iconify-icon icon="lucide:book-open" class="text-2xl text-gray-300 group-hover:text-[#1CB0F6] transition-colors"></iconify-icon>
                </div>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Tasks</span>
            </a>
            <a href="assistant.html" class="flex flex-col items-center gap-1 group py-2 flex-1 relative -top-2">
                <div class="w-14 h-14 rounded-2xl bg-[#58CC02] btn-3d border-b-[#46A302] flex items-center justify-center text-white shadow-lg">
                    <iconify-icon icon="lucide:sparkles" class="text-3xl"></iconify-icon>
                </div>
            </a>
            <a href="announcements.html" class="flex flex-col items-center gap-1 group py-2 flex-1">
                <div class="w-12 h-8 rounded-xl flex items-center justify-center">
                    <iconify-icon icon="lucide:bell" class="text-2xl text-gray-300 group-hover:text-[#1CB0F6] transition-colors"></iconify-icon>
                </div>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Feed</span>
            </a>
            <a href="login.html" class="flex flex-col items-center gap-1 group py-2 flex-1">
                <div class="w-12 h-8 rounded-xl flex items-center justify-center">
                    <iconify-icon icon="lucide:user-circle" class="text-2xl text-gray-300 group-hover:text-[#1CB0F6] transition-colors"></iconify-icon>
                </div>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Profile</span>
            </a>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = getSession();
            if (session.isLoggedIn && session.user) {
                document.getElementById('faculty-greeting').textContent = `Hi ${session.user.name || 'Prof. Arun'}!`;
            }

            renderAssignForm();
            updateStatsAndWorks();

            document.getElementById('tab-assign').addEventListener('click', renderAssignForm);
            document.getElementById('tab-announcement').addEventListener('click', renderAnnounceForm);
        });

        function updateStatsAndWorks() {
            const tasks = getTasks();
            const announcements = getAnnouncements();

            document.getElementById('stat-tasks-count').textContent = tasks.length;
            document.getElementById('stat-notices-count').textContent = announcements.length;

            const listContainer = document.getElementById('published-list-container');
            listContainer.innerHTML = '';

            const recentTasks = tasks.slice(0, 4);
            if (recentTasks.length === 0) {
                listContainer.innerHTML = `
                    <div class="duo-card rounded-[20px] p-6 bg-white text-center">
                        <p class="text-xs font-bold text-gray-400">No published tasks yet. Create one above!</p>
                    </div>
                `;
                return;
            }

            recentTasks.forEach(t => {
                const item = document.createElement('div');
                item.className = 'duo-card rounded-[20px] p-4 flex items-center justify-between bg-white border-l-[8px] border-l-[#1CB0F6]';
                item.innerHTML = `
                    <div class="min-w-0 flex-1 pr-3">
                        <h4 class="font-black text-base leading-tight truncate text-[#4B4B4B]">${escapeHtml(t.title)}</h4>
                        <div class="flex items-center gap-3 mt-1">
                            <span class="text-xs font-bold text-gray-400">${escapeHtml(t.subject || 'Course')}</span>
                            <span class="w-1 h-1 bg-gray-300 rounded-full"></span>
                            <span class="text-xs font-bold text-[#1CB0F6]">Deadline: ${t.deadline || 'None'}</span>
                        </div>
                    </div>
                    <button class="delete-btn text-gray-300 hover:text-[#FF4B4B] p-2" title="Delete task">
                        <iconify-icon icon="lucide:trash-2" class="text-lg"></iconify-icon>
                    </button>
                `;

                item.querySelector('.delete-btn').addEventListener('click', () => {
                    if (confirm(`Remove "${t.title}" from class planner?`)) {
                        deleteTask(t.id);
                        showToast('Assignment Removed', `"${t.title}" deleted.`, 'lucide:trash', '#FF4B4B');
                        updateStatsAndWorks();
                    }
                });

                listContainer.appendChild(item);
            });
        }

        function renderAssignForm() {
            const tabAssign = document.getElementById('tab-assign');
            const tabAnnounce = document.getElementById('tab-announcement');
            const formContainer = document.getElementById('form-container');

            tabAssign.className = 'flex-1 py-3 px-2 rounded-xl bg-white duo-card border-none text-xs font-black text-[#1CB0F6] uppercase tracking-wide cursor-pointer';
            tabAnnounce.className = 'flex-1 py-3 px-2 rounded-xl bg-transparent text-xs font-black text-gray-400 uppercase tracking-wide cursor-pointer';

            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 2);
            const defaultDate = tomorrow.toISOString().split('T')[0];

            formContainer.innerHTML = `
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Assignment Title</label>
                    <input type="text" id="faculty-task-title" placeholder="e.g. Quantum Physics Quiz 2" class="w-full p-3.5 bg-gray-50 border-2 border-gray-200 rounded-xl font-bold duo-input text-sm">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Subject</label>
                        <select id="faculty-task-subject" class="w-full p-3.5 bg-gray-50 border-2 border-gray-200 rounded-xl font-bold appearance-none duo-input text-sm">
                            <option value="Physics 101">Physics 101</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Math 150">Math 150</option>
                            <option value="History">History</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Deadline</label>
                        <input type="date" id="faculty-task-date" value="${defaultDate}" class="w-full p-3.5 bg-gray-50 border-2 border-gray-200 rounded-xl font-bold duo-input text-sm">
                    </div>
                </div>

                <button id="btn-publish-assignment" class="w-full py-4 bg-[#58CC02] text-white font-black rounded-2xl btn-3d border-b-[#46A302] uppercase tracking-widest text-xs mt-2 cursor-pointer">
                    Publish to Class (+120 XP for Students)
                </button>
            `;

            document.getElementById('btn-publish-assignment').addEventListener('click', () => {
                const title = document.getElementById('faculty-task-title').value.trim();
                const subject = document.getElementById('faculty-task-subject').value;
                const date = document.getElementById('faculty-task-date').value;

                if (!title) {
                    showToast('Missing Title', 'Please enter an assignment title.', 'lucide:alert-circle', '#FF4B4B');
                    return;
                }

                const newTask = {
                    id: 'task_' + Date.now(),
                    title,
                    subject,
                    deadline: date,
                    status: 'Not Started',
                    xp: 120
                };

                addTask(newTask);
                showToast('Assignment Published! 📚', `"${title}" is now visible to all students.`, 'lucide:send', '#58CC02');
                document.getElementById('faculty-task-title').value = '';
                updateStatsAndWorks();
            });
        }

        function renderAnnounceForm() {
            const tabAssign = document.getElementById('tab-assign');
            const tabAnnounce = document.getElementById('tab-announcement');
            const formContainer = document.getElementById('form-container');

            tabAnnounce.className = 'flex-1 py-3 px-2 rounded-xl bg-white duo-card border-none text-xs font-black text-[#1CB0F6] uppercase tracking-wide cursor-pointer';
            tabAssign.className = 'flex-1 py-3 px-2 rounded-xl bg-transparent text-xs font-black text-gray-400 uppercase tracking-wide cursor-pointer';

            formContainer.innerHTML = `
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Announcement Title</label>
                    <input type="text" id="faculty-ann-title" placeholder="e.g. Midterm Schedule Update" class="w-full p-3.5 bg-gray-50 border-2 border-gray-200 rounded-xl font-bold duo-input text-sm">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Message</label>
                    <textarea id="faculty-ann-msg" rows="3" placeholder="Write your announcement message..." class="w-full p-3.5 bg-gray-50 border-2 border-gray-200 rounded-xl font-bold duo-input text-sm resize-none"></textarea>
                </div>
                <button id="btn-blast-announce" class="w-full py-4 bg-[#FFC800] text-white font-black rounded-2xl btn-3d border-b-[#D9A000] uppercase tracking-widest text-xs mt-2 cursor-pointer">
                    Blast Announcement to Feed 📢
                </button>
            `;

            document.getElementById('btn-blast-announce').addEventListener('click', () => {
                const title = document.getElementById('faculty-ann-title').value.trim();
                const msg = document.getElementById('faculty-ann-msg').value.trim();

                if (!title || !msg) {
                    showToast('Incomplete Notice', 'Please enter both title and message.', 'lucide:alert-circle', '#FF4B4B');
                    return;
                }

                const newAnn = {
                    id: 'ann_' + Date.now(),
                    title,
                    author: 'Prof. Arun',
                    time: 'Just now',
                    category: 'academic',
                    urgent: false,
                    content: msg,
                    isNew: true,
                    read: false
                };

                addAnnouncement(newAnn);
                showToast('Notice Broadcasted! 📢', `Sent to campus feed for all students.`, 'lucide:megaphone', '#FFC800');
                document.getElementById('faculty-ann-title').value = '';
                document.getElementById('faculty-ann-msg').value = '';
                updateStatsAndWorks();
            });
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body></html>
