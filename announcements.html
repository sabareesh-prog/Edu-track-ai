<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrack AI - Announcements</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="script.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FFFFFF;
            color: #4B4B4B;
        }

        /* Duolingo-style 3D Button Effect */
        .btn-3d {
            position: relative;
            transition: all 0.1s;
            border-bottom-width: 4px;
        }
        .btn-3d:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }

        /* Card Styles */
        .duo-card {
            border: 2px solid #E5E5E5;
            border-bottom-width: 4px;
            transition: transform 0.15s ease;
        }
        .duo-card:active {
            transform: scale(0.98);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div class="w-full h-screen flex flex-col bg-white">
        <!-- Header -->
        <header class="shrink-0 pt-14 px-6 pb-4 bg-white border-b-2 border-gray-100 flex items-center justify-between">
            <h1 class="text-2xl font-black tracking-tight">Campus Feed</h1>
            <div class="flex items-center gap-2">
                <div id="streak-indicator" class="flex items-center gap-1 cursor-pointer" onclick="showToast('Campus Reader Streak 🔥', `${getStudentProfile().streak} days active! Keep checking daily updates.`, 'lucide:flame', '#FF9600')">
                    <iconify-icon icon="lucide:flame" class="text-[#FF9600] text-xl"></iconify-icon>
                    <span id="streak-count" class="font-black text-[#FF9600]">7</span>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto px-6 py-6 space-y-4 no-scrollbar">
            
            <!-- Category Chips -->
            <div class="flex gap-2.5 overflow-x-auto pb-2 no-scrollbar">
                <button id="btn-cat-all" class="cat-filter-btn shrink-0 px-5 py-2 rounded-full bg-[#1CB0F6] text-white font-black text-sm uppercase tracking-wide btn-3d border-b-[#1483B8] cursor-pointer">
                    All (<span id="count-cat-all">0</span>)
                </button>
                <button id="btn-cat-academic" class="cat-filter-btn shrink-0 px-5 py-2 rounded-full bg-white text-[#777777] font-black text-sm uppercase tracking-wide border-2 border-[#E5E5E5] border-b-4 hover:bg-gray-50 cursor-pointer">
                    Academic (<span id="count-cat-academic">0</span>)
                </button>
                <button id="btn-cat-campus" class="cat-filter-btn shrink-0 px-5 py-2 rounded-full bg-white text-[#777777] font-black text-sm uppercase tracking-wide border-2 border-[#E5E5E5] border-b-4 hover:bg-gray-50 cursor-pointer">
                    Campus (<span id="count-cat-campus">0</span>)
                </button>
            </div>

            <!-- Dynamic Announcements Container -->
            <div id="announcements-list-container" class="space-y-4">
                <!-- Dynamically populated -->
            </div>

            <!-- Empty State Spacer -->
            <div class="h-24"></div>
        </main>

        <!-- Bottom Navigation -->
        <footer class="shrink-0 pb-[34px] bg-white border-t-2 border-[#E5E5E5] px-4 flex items-center justify-between h-[100px] z-50">
            <a href="student.html" id="nav-home" class="flex flex-col items-center gap-1 group py-2 flex-1">
                <div class="w-12 h-8 rounded-xl flex items-center justify-center">
                    <iconify-icon icon="lucide:home" class="text-2xl text-gray-300 group-hover:text-[#58CC02] transition-colors"></iconify-icon>
                </div>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Home</span>
            </a>
            <a href="assignments.html" id="nav-assignments" class="flex flex-col items-center gap-1 group py-2 flex-1">
                <div class="w-12 h-8 rounded-xl flex items-center justify-center">
                    <iconify-icon icon="lucide:book-open" class="text-2xl text-gray-300 group-hover:text-[#58CC02] transition-colors"></iconify-icon>
                </div>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Tasks</span>
            </a>
            <a href="assistant.html" id="nav-ai" class="flex flex-col items-center gap-1 group py-2 flex-1 relative -top-2">
                <div class="w-14 h-14 rounded-2xl bg-[#1CB0F6] btn-3d border-b-[#1483B8] flex items-center justify-center text-white shadow-lg">
                    <iconify-icon icon="lucide:sparkles" class="text-3xl"></iconify-icon>
                </div>
            </a>
            <a href="announcements.html" id="nav-announcements" class="flex flex-col items-center gap-1 group py-2 flex-1">
                <div class="w-12 h-8 rounded-xl bg-[#58CC02]/10 flex items-center justify-center">
                    <iconify-icon icon="lucide:bell" class="text-2xl text-[#58CC02]"></iconify-icon>
                </div>
                <span class="text-[10px] font-black text-[#58CC02] uppercase tracking-widest">Feed</span>
            </a>
            <a href="login.html" id="nav-profile" class="flex flex-col items-center gap-1 group py-2 flex-1">
                <div class="w-12 h-8 rounded-xl flex items-center justify-center">
                    <iconify-icon icon="lucide:user-circle" class="text-2xl text-gray-300 group-hover:text-[#58CC02] transition-colors"></iconify-icon>
                </div>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Profile</span>
            </a>
        </footer>
    </div>

    <script>
        let currentCategory = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            const student = getStudentProfile();
            document.getElementById('streak-count').textContent = student.streak || 7;

            renderAnnouncements();

            // Filter button events
            document.getElementById('btn-cat-all').addEventListener('click', () => setCategory('all'));
            document.getElementById('btn-cat-academic').addEventListener('click', () => setCategory('academic'));
            document.getElementById('btn-cat-campus').addEventListener('click', () => setCategory('campus'));
        });

        function setCategory(cat) {
            currentCategory = cat;
            const catMap = {
                'all': document.getElementById('btn-cat-all'),
                'academic': document.getElementById('btn-cat-academic'),
                'campus': document.getElementById('btn-cat-campus')
            };

            Object.keys(catMap).forEach(k => {
                const btn = catMap[k];
                if (k === cat) {
                    btn.className = 'cat-filter-btn shrink-0 px-5 py-2 rounded-full bg-[#1CB0F6] text-white font-black text-sm uppercase tracking-wide btn-3d border-b-[#1483B8] cursor-pointer';
                } else {
                    btn.className = 'cat-filter-btn shrink-0 px-5 py-2 rounded-full bg-white text-[#777777] font-black text-sm uppercase tracking-wide border-2 border-[#E5E5E5] border-b-4 hover:bg-gray-50 cursor-pointer';
                }
            });

            renderAnnouncements();
        }

        function renderAnnouncements() {
            const list = getAnnouncements();
            const container = document.getElementById('announcements-list-container');

            // Update Counts
            const allCount = list.length;
            const academicCount = list.filter(a => a.category === 'academic').length;
            const campusCount = list.filter(a => a.category === 'campus').length;

            document.getElementById('count-cat-all').textContent = allCount;
            document.getElementById('count-cat-academic').textContent = academicCount;
            document.getElementById('count-cat-campus').textContent = campusCount;

            // Filter
            let filtered = list;
            if (currentCategory !== 'all') {
                filtered = list.filter(a => a.category === currentCategory);
            }

            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="duo-card rounded-[20px] p-8 bg-white text-center">
                        <iconify-icon icon="lucide:bell-off" class="text-3xl text-gray-300 mb-2"></iconify-icon>
                        <p class="font-black text-sm text-[#4B4B4B]">No announcements in this category.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                const isRead = item.read === true;
                const card = document.createElement('div');
                card.className = `duo-card rounded-[20px] p-5 bg-white relative cursor-pointer transition-all ${isRead ? 'opacity-70 bg-gray-50' : 'hover:scale-[1.01]'}`;

                // Icon and Color based on category
                let iconName = 'lucide:megaphone';
                let iconColor = '#1CB0F6';
                if (item.category === 'campus') {
                    iconName = 'lucide:library';
                    iconColor = '#58CC02';
                } else if (item.urgent) {
                    iconName = 'lucide:alert-circle';
                    iconColor = '#FF4B4B';
                }

                // Badges
                let badges = '';
                if (item.urgent) {
                    badges += `<span class="px-3 py-1 bg-[#FF4B4B]/10 text-[#FF4B4B] border border-[#FF4B4B]/20 text-[10px] font-black rounded-full uppercase">Urgent</span>`;
                }
                if (item.category) {
                    badges += `<span class="px-3 py-1 bg-gray-100 text-gray-500 text-[10px] font-black rounded-full uppercase">${escapeHtml(item.category)}</span>`;
                }
                if (!isRead) {
                    badges += `<span class="px-3 py-1 bg-[#1CB0F6] text-white text-[10px] font-black rounded-full uppercase">Unread</span>`;
                }

                card.innerHTML = `
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0" style="background-color: ${iconColor}15; color: ${iconColor};">
                                <iconify-icon icon="${iconName}" class="text-2xl"></iconify-icon>
                            </div>
                            <div>
                                <h3 class="font-black text-base ${isRead ? 'text-gray-600' : 'text-[#4B4B4B]'}">${escapeHtml(item.title)}</h3>
                                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">${escapeHtml(item.author || 'Admin')} • ${escapeHtml(item.time || 'Today')}</p>
                            </div>
                        </div>
                        ${!isRead ? `<span class="unread-dot flex h-3 w-3 rounded-full bg-[#1CB0F6] ring-4 ring-[#1CB0F6]/10 shrink-0"></span>` : ''}
                    </div>
                    <p class="text-sm font-bold leading-relaxed mb-4 ${isRead ? 'text-gray-500' : 'text-[#4B4B4B]'}">
                        ${escapeHtml(item.content)}
                    </p>
                    <div class="flex items-center gap-2">
                        ${badges}
                    </div>
                `;

                // Click to toggle read
                card.addEventListener('click', () => {
                    item.read = !item.read;
                    saveAnnouncements(list);
                    if (item.read) {
                        showToast('Acknowledged 📖', `Marked "${item.title}" as read.`, 'lucide:check-circle', '#58CC02');
                    } else {
                        showToast('Marked as Unread', `"${item.title}" set to unread.`, 'lucide:bell', '#1CB0F6');
                    }
                    renderAnnouncements();
                });

                container.appendChild(card);
            });
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body></html>
